name: Android CI

on:
  push:
    branches: [ "android" ]
  pull_request:
    branches: [ "android" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache LLVM
      uses: actions/cache@v4
      with:
        path: build/llvm
        key: llvm-20.1.8-${{ runner.os }}-${{ hashFiles('tools/android/build-llvm.sh') }}

    - name: Build LLVM
      run: tools/android/build-llvm.sh

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
    - name: Build with Gradle
      working-directory: android
      env:
        GRADLE_OPTS: -Xmx2g
      run: ./gradlew assembleDebug -PwwhdDeviceRecomp

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wwhd-fork-apk
        path: android/app/build/outputs/apk/debug/*.apk
